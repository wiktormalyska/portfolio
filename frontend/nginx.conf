server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # explicit overrides for types nginx sometimes misses
    types {
        application/javascript          js mjs;
        text/css                        css;
        text/html                       html htm;
        application/pdf                 pdf;
        font/woff                       woff;
        font/woff2                      woff2;
        font/ttf                        ttf;
        font/otf                        otf;
        image/svg+xml                   svg svgz;
        image/png                       png;
        image/jpeg                      jpg jpeg;
        image/webp                      webp;
        application/json                json;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PDFs live under stable URLs (Wiktor_Malyska_PL.pdf) but their contents change on every
    # CV export, so "immutable" would pin a stale copy in every visitor's browser for a year.
    # Revalidate instead - the ETag keeps it to a 304 when nothing changed.
    # Must stay above the generic asset block: nginx takes the first matching regex location.
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames for these, so immutable is safe.
    location ~* \.(js|mjs|css|woff|woff2|ttf|otf|svg|png|jpg|jpeg|webp|json|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
